[workspace]
resolver = "2"
members = ["crates/core", "crates/config", "crates/store", "crates/images", "crates/index", "crates/sync", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
photomem-core = { path = "crates/core" }
photomem-config = { path = "crates/config" }
photomem-store = { path = "crates/store" }
photomem-images = { path = "crates/images" }
photomem-index = { path = "crates/index" }
photomem-sync = { path = "crates/sync" }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }

# "Little" is a stated goal, so ship without debug symbols and let LLVM drop
# what is not reachable. Takes the binary from 19M to about 9M.
[profile.release]
strip = true
lto = true
codegen-units = 1

# The same optimisations without the two settings that make a release build
# serial: fat LTO is one long single-threaded link of the whole program, and
# codegen-units = 1 gives up all parallelism inside a crate. Both earn their
# place in a shipped binary and neither earns it in a rebuild loop.
#
#   cargo build --profile quick     # then run target/quick/photomem
#
# Bigger binary, same behaviour.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
strip = false
incremental = true
