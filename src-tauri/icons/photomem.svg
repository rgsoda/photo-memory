<!--
  The app icon: the same mark as the tray, given a ground and a container.
  A tray glyph and an app icon are different jobs — one has to disappear into a
  status bar, the other has to be picked out of a dock at a glance — so this one
  is coloured and tiled where that one is a bare monochrome shape.

  Drawn on Apple's 1024 grid with an 824 tile inset 100, which is what makes it
  sit at the same visual size as stock macOS icons instead of looming over them.
  White on blue rather than blue on ink: at 16px the low-contrast version turns
  into a dark smudge, and 16px is a size this has to survive.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3ff"/>
      <stop offset="1" stop-color="#3b6fd8"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)"/>
  <!-- The 16-unit mark, scaled and centred on the tile. -->
  <g transform="translate(220,220) scale(36.5)">
    <g fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <rect x="1.7" y="2.7" width="12.6" height="10.6" rx="2.2"/>
      <path d="M2.4 12.2 L6.6 7.6 L9.4 10.6 L11.2 8.9 L13.6 11.6"/>
    </g>
    <circle cx="5.6" cy="6.1" r="1.15" fill="#ffffff"/>
  </g>
</svg>
