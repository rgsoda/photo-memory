<!--
  The tray icon, drawn on a 16-unit grid because 16px is the size that has to
  survive; every other rendition is this geometry scaled, not a redraw.

  Monochrome on purpose. macOS recolours a template image to match the menu
  bar, and a status bar on Linux sits on one flat colour — a two-tone icon
  would be legible on neither. render.sh turns this into the two PNGs the app
  embeds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="1.7" y="2.7" width="12.6" height="10.6" rx="2.2"/>
    <path d="M2.4 12.2 L6.6 7.6 L9.4 10.6 L11.2 8.9 L13.6 11.6"/>
  </g>
  <circle cx="5.6" cy="6.1" r="1.15" fill="currentColor"/>
</svg>
