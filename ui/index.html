<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>photomem</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="shell">
      <textarea
        id="editor"
        placeholder="First line becomes the title…"
        spellcheck="false"
        autofocus
      ></textarea>
      <footer>
        <span id="status"></span>
        <span class="hints">
          <kbd>Ctrl</kbd><kbd>↵</kbd> save
          <kbd>Esc</kbd> dismiss
        </span>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
