<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>photomem</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="shell">
      <!-- Capture: the default, and the only mode that writes anything. -->
      <section id="capture">
        <textarea
          id="editor"
          placeholder="First line becomes the title…   //  to search"
          spellcheck="false"
          autofocus
        ></textarea>
        <div id="strip" hidden></div>
      </section>

      <!-- Search: reached by typing // into an empty buffer. -->
      <section id="search" hidden>
        <input id="query" type="text" placeholder="Search notes…" spellcheck="false" />
        <ul id="results"></ul>
      </section>

      <!-- Viewer: read-only. Notes are never edited here; see DESIGN.md §6. -->
      <section id="viewer" hidden>
        <!-- Above the title, because the one failure mode of never editing a
             note is reading it without learning it was later corrected. -->
        <div id="viewer-superseded" hidden></div>
        <header>
          <h1 id="viewer-title"></h1>
          <time id="viewer-when"></time>
        </header>
        <pre id="viewer-body"></pre>
        <div id="viewer-images"></div>
        <div id="viewer-backlinks" hidden>
          <h2>Linked from</h2>
          <ul></ul>
        </div>
      </section>

      <footer>
        <span id="status"></span>
        <span id="hints"></span>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
